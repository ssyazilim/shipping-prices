# Refreshes index.json from Geliver's price list on the first day of every month, 09:00 Turkey time; it can also be
# started by hand from the Actions tab. A failed run leaves the old prices in place and GitHub mails the failure
name: Update shipping prices

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/update-prices.mjs
        env:
          GELIVER_TOKEN: ${{ secrets.GELIVER_TOKEN }}
      # The date is committed on every run: GitHub turns off the schedule of a public repository with no commits for
      # 60 days, which months with unchanged prices would otherwise cause
      - run: date -u +%F > updated-at.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json updated-at.txt
          git commit -m "chore(no-ticket): update shipping prices"
          git push
